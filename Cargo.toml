[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/fieldwork-ai/lighter"
authors = ["Nick Rogers"]

[workspace.dependencies]
lighter-hv = { path = "crates/lighter-hv", version = "0.2.0" }
lighter-vmm = { path = "crates/lighter-vmm", version = "0.2.0" }
lighter-docker = { path = "crates/lighter-docker", version = "0.2.0" }
lighter-fs = { path = "crates/lighter-fs", version = "0.2.0" }

anyhow = "1"
thiserror = "2"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# The VMM is a latency-sensitive process: one fat binary, no unwinding cost on
# the vCPU threads, and the optimizer allowed to see across crate boundaries.
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
lto = "fat"
codegen-units = 1
