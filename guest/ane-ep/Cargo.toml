[package]
name = "lighter_ane_ep"
version = "0.1.0"
edition = "2021"
publish = false

# Not a workspace member: it is a Linux artifact that lives in the guest's
# root filesystem, built by build.sh, and it links against nothing — no libc
# at all — so the one library loads in any container whatever its libc.
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
linked_list_allocator = { version = "0.10", default-features = false, features = ["use_spin"] }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
