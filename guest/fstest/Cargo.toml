[package]
name = "lighter-fstest"
description = "The guest half of the shared-filesystem coherence suite"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

# Deliberately NOT a member of the root workspace, for the same reason the agent
# is not: it is a linux-aarch64-musl binary built inside a container, and half
# of what it tests does not exist on macOS.

[dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
