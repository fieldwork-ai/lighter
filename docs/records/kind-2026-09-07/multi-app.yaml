apiVersion: v1
kind: Namespace
metadata:
  name: qualification
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: qualification
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: qualification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: lighter-kind-app:qualification
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 1
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: mac
          mountPath: /mac
      volumes:
      - name: mac
        hostPath:
          path: /host-fixture
          type: Directory
      - name: data
        persistentVolumeClaim:
          claimName: data
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: qualification
spec:
  type: NodePort
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080

---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: qualification
spec:
  nodeName: lighter-multi-control-plane
  tolerations:
  - operator: Exists
  containers:
  - name: client
    image: lighter-kind-app:qualification
    imagePullPolicy: Never
    command: [sleep, "3600"]
