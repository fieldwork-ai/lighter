[package]
name = "lighter-vmm"
description = "The lighter machine: what the guest runs on under Virtualization.framework, and the host half of every channel into it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
lighter-docker.workspace = true
lighter-fs.workspace = true

libc.workspace = true
thiserror.workspace = true
tracing.workspace = true
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
objc2-virtualization = "0.3"
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-tcp-cubic"] }

[dev-dependencies]
tracing-subscriber.workspace = true

[[example]]
name = "lighter-bench"
path = "examples/lighter-bench.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
