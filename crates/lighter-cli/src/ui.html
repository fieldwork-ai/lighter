<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lighter</title>
<style>
  :root {
    --bg: #fafaf9; --panel: #fff; --text: #1c1917; --muted: #78716c;
    --line: #e7e5e4; --accent: #ea580c; --ok: #16a34a; --bad: #dc2626;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0a09; --panel: #1c1917; --text: #f5f5f4; --muted: #a8a29e;
      --line: #292524; --accent: #fb923c; --ok: #4ade80; --bad: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 28px 0 8px; }
  .pill { padding: 2px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
  .pill.up { color: var(--ok); border-color: currentColor; }
  .pill.down { color: var(--bad); border-color: currentColor; }
  .spacer { flex: 1; }
  button {
    font: inherit; padding: 4px 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .stat b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  .table { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  td.actions { text-align: right; }
  td.actions button { padding: 2px 8px; font-size: 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
  .dot.running { background: var(--ok); }
  .dot.exited, .dot.dead { background: var(--bad); }
  .muted { color: var(--muted); }
  pre {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; margin: 0; max-height: 400px; overflow: auto;
    font: 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; word-break: break-all;
  }
  #msg { min-height: 1.5em; color: var(--bad); white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🔥 lighter</h1>
    <span id="state" class="pill">…</span>
    <span id="version" class="muted"></span>
    <span class="spacer"></span>
    <button data-machine="start">Start</button>
    <button data-machine="restart">Restart</button>
    <button data-machine="stop">Stop</button>
  </header>
  <div id="msg"></div>

  <div class="stats" id="stats"></div>

  <h2>Containers</h2>
  <div class="table">
    <table>
      <thead><tr><th>Name</th><th>Image</th><th>Status</th><th>Ports</th><th></th></tr></thead>
      <tbody id="containers"><tr><td colspan="5" class="muted">…</td></tr></tbody>
    </table>
  </div>

  <h2>Machine log <button id="log-toggle">Show</button></h2>
  <pre id="log" hidden></pre>
</main>
<script>
"use strict";
const token = location.hash.slice(1);
const $ = (id) => document.getElementById(id);
let busy = false;

async function api(method, path) {
  const res = await fetch("/api/" + path, { method, headers: { "X-Lighter-Token": token } });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.status + " " + res.statusText);
  return body;
}

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text != null) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

function stat(value, label) {
  const d = el("div", null, "stat");
  d.append(el("b", value), el("span", label));
  return d;
}

function showError(e) { $("msg").textContent = e ? String(e.message || e) : ""; }

async function refreshStatus() {
  const s = await api("GET", "status");
  const state = $("state");
  state.textContent = s.running ? "running" : "stopped";
  state.className = "pill " + (s.running ? "up" : "down");
  $("version").textContent = "v" + s.version;
  document.querySelectorAll("[data-machine]").forEach((b) => {
    const a = b.dataset.machine;
    b.disabled = busy || (a === "start" ? s.running : !s.running);
  });
  const stats = [
    stat(s.cpus, "CPUs"),
    stat(s.memory_mib + " MiB", "memory limit"),
    stat(s.disk_gib + " GiB", "disk"),
  ];
  if (s.running) {
    if (s.footprint_mib != null) stats.push(stat(s.footprint_mib + " MiB", "on the Mac"));
    if (s.guest_memory) {
      const used = s.guest_memory.total_mib - s.guest_memory.available_mib;
      stats.push(stat(used + " / " + s.guest_memory.total_mib + " MiB", "guest memory used"));
    }
    stats.push(stat(s.docker || "not answering", "docker"));
  }
  $("stats").replaceChildren(...stats);
  return s.running;
}

function ports(c) {
  const seen = new Set();
  for (const p of c.Ports || []) {
    if (!p.PublicPort) continue;
    seen.add(p.PublicPort + "→" + p.PrivatePort + "/" + p.Type);
  }
  return [...seen].join(", ");
}

async function refreshContainers(running) {
  const body = $("containers");
  if (!running) {
    body.replaceChildren(row("The machine is not running."));
    return;
  }
  const list = await api("GET", "containers");
  if (!list.length) { body.replaceChildren(row("No containers.")); return; }
  body.replaceChildren(...list.map((c) => {
    const tr = el("tr");
    const name = el("td");
    name.append(el("span", null, "dot " + c.State), (c.Names[0] || c.Id.slice(0, 12)).replace(/^\//, ""));
    const actions = el("td", null, "actions");
    const up = c.State === "running";
    for (const a of up ? ["restart", "stop"] : ["start"]) {
      const b = el("button", a);
      b.disabled = busy;
      b.onclick = () => act("containers/" + c.Id + "/" + a);
      actions.append(b, " ");
    }
    tr.append(name, el("td", c.Image), el("td", c.Status, "muted"), el("td", ports(c)), actions);
    return tr;
  }));
}

function row(text) {
  const tr = el("tr");
  const td = el("td", text, "muted");
  td.colSpan = 5;
  tr.append(td);
  return tr;
}

async function refresh() {
  try {
    const running = await refreshStatus();
    await refreshContainers(running);
    if (!$("log").hidden) await refreshLog();
    if (!busy) showError(null);
  } catch (e) { showError(e); }
}

async function refreshLog() {
  const log = $("log");
  const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
  log.textContent = (await api("GET", "logs")).text || "(empty)";
  if (atBottom) log.scrollTop = log.scrollHeight;
}

async function act(path) {
  busy = true;
  document.querySelectorAll("button").forEach((b) => { if (b.id !== "log-toggle") b.disabled = true; });
  $("msg").textContent = "";
  try {
    const r = await api("POST", path);
    if (r.ok === false) showError(r.output);
  } catch (e) { showError(e); }
  busy = false;
  refresh();
}

document.querySelectorAll("[data-machine]").forEach((b) => {
  b.onclick = () => act("machine/" + b.dataset.machine);
});
$("log-toggle").onclick = () => {
  const log = $("log");
  log.hidden = !log.hidden;
  $("log-toggle").textContent = log.hidden ? "Show" : "Hide";
  if (!log.hidden) refreshLog().then(() => { log.scrollTop = log.scrollHeight; }, showError);
};

// Poll only while the tab is visible: a background tab costs nothing.
let timer = null;
function schedule() {
  clearInterval(timer);
  timer = document.hidden ? null : setInterval(() => { if (!busy) refresh(); }, 3000);
}
document.addEventListener("visibilitychange", () => { schedule(); if (!document.hidden) refresh(); });
if (!token) showError("No token in the URL: open the link `lighter ui` printed.");
else { refresh(); schedule(); }
</script>
</body>
</html>
