<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lighter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f5f4; --panel: #ffffff; --panel-2: #f2f1ef; --text: #1c1917; --muted: #78716c;
    --line: #e7e5e4; --accent: #ea580c; --accent-soft: #fff1e8; --ok: #15803d; --warn: #b45309;
    --bad: #dc2626; --code: #fbfaf9; --shadow: 0 8px 30px rgba(0,0,0,.12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0d0c; --panel: #1a1716; --panel-2: #221f1d; --text: #f5f5f4; --muted: #a8a29e;
      --line: #2e2a27; --accent: #fb923c; --accent-soft: #2a1a10; --ok: #4ade80; --warn: #fbbf24;
      --bad: #f87171; --code: #141211; --shadow: 0 8px 30px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .app { display: grid; grid-template-columns: 210px 1fr; height: 100%; }

  /* Sidebar */
  nav {
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 14px 10px; gap: 2px; min-height: 0;
  }
  .brand { display: flex; align-items: center; gap: 8px; padding: 2px 8px 14px; font-weight: 600; font-size: 15px; }
  .brand small { color: var(--muted); font-weight: 400; font-size: 11px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px;
    color: var(--text); cursor: pointer; border: 0; background: none; font: inherit; text-align: left; width: 100%;
  }
  .nav-item:hover { background: var(--panel-2); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  .nav-item .count { margin-left: auto; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .machine { margin-top: auto; border-top: 1px solid var(--line); padding: 12px 6px 0; display: grid; gap: 8px; }
  .machine-head { display: flex; align-items: center; gap: 8px; }
  .machine-head b { font-weight: 500; }
  .machine-buttons { display: flex; gap: 6px; }
  .machine-buttons button { flex: 1; justify-content: center; }
  .meter { height: 5px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s; }
  .machine-line { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }

  /* Main */
  main { min-width: 0; overflow: auto; padding: 22px 26px 40px; }
  .view { display: none; }
  .view.active { display: block; }
  .head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .head h1 { font-size: 20px; margin: 0 8px 0 0; font-weight: 600; }
  .head .sub { color: var(--muted); }
  .spacer { flex: 1; }
  input[type=text], input[type=search], input[type=number], select {
    font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 9px; outline: none; min-width: 0;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input[type=search] { width: 220px; }
  button {
    font: inherit; display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px;
    border-radius: 7px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--text);
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
  button.icon { padding: 4px; border-color: transparent; background: none; color: var(--muted); }
  button.icon:hover:not(:disabled) { color: var(--text); background: var(--panel-2); border-color: transparent; }
  button.icon.danger:hover:not(:disabled) { color: var(--bad); }
  svg { width: 16px; height: 16px; fill: currentColor; flex: none; }
  svg.s { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  label.check { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; user-select: none; }

  /* Tables */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .table { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover td { background: var(--panel-2); }
  tr.group td { background: var(--panel-2); font-weight: 500; }
  tr.child td:first-child { padding-left: 34px; }
  td.actions { text-align: right; width: 1%; }
  td.actions > div { display: inline-flex; gap: 2px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .name { display: flex; align-items: center; gap: 8px; }
  .name small { color: var(--muted); font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; }
  .chev { transition: transform .15s; color: var(--muted); }
  .chev.open { transform: rotate(90deg); }
  .muted { color: var(--muted); }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.running { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
  .dot.paused, .dot.restarting { background: var(--warn); }
  .dot.exited, .dot.dead { background: var(--bad); opacity: .7; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; border: 1px solid var(--line); color: var(--muted); }
  .badge.on { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .ports a { display: inline-flex; align-items: center; gap: 3px; margin-right: 8px; }
  .ports svg { width: 12px; height: 12px; }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); }
  .empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 6px; }
  .empty button { margin-top: 12px; }

  /* Stat cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .stat { padding: 12px 14px; }
  .stat > span { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .stat b { display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; margin: 2px 0; }
  .stat .meter { margin: 8px 0; }
  .stat .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); }
  .spark { width: 100%; height: 44px; display: block; margin-top: 6px; }
  .spark polyline { fill: none; stroke: var(--accent); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .spark polygon { fill: var(--accent); opacity: .12; }

  /* Drawer */
  .drawer-back { position: fixed; inset: 0; background: rgba(0,0,0,.25); display: none; z-index: 10; }
  .drawer-back.open { display: block; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(860px, 100%); background: var(--bg);
    border-left: 1px solid var(--line); box-shadow: var(--shadow); z-index: 11;
    display: flex; flex-direction: column; transform: translateX(100%); transition: transform .18s ease;
  }
  .drawer.open { transform: none; }
  .drawer-head { padding: 16px 20px 0; background: var(--panel); border-bottom: 1px solid var(--line); }
  .drawer-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .drawer-title h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .drawer-meta { color: var(--muted); margin: 4px 0 10px; display: flex; gap: 14px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 2px; }
  .tab {
    border: 0; background: none; border-radius: 0; padding: 8px 12px; color: var(--muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab:hover:not(:disabled) { color: var(--text); border-color: transparent; border-bottom-color: var(--line); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .drawer-body { flex: 1; min-height: 0; overflow: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
  /* A scrolling child of a flex column shrinks to nothing unless told not to. */
  .drawer-body > * { flex: none; }
  .drawer-body > pre.log { flex: 1; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  pre.log {
    flex: 1; min-height: 200px; margin: 0; overflow: auto; background: var(--code); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
    white-space: pre-wrap; word-break: break-all;
  }
  pre.log .err { color: var(--bad); }
  pre.log .ts { color: var(--muted); }
  pre.log mark { background: color-mix(in srgb, var(--accent) 35%, transparent); color: inherit; border-radius: 2px; }
  dl.kv { display: grid; grid-template-columns: 160px 1fr; gap: 6px 14px; margin: 0; padding: 14px; }
  dl.kv dt { color: var(--muted); }
  dl.kv dd { margin: 0; word-break: break-all; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 8px 0 6px; font-weight: 500; }
  details > summary { cursor: pointer; color: var(--muted); padding: 4px 0; }
  .secret { cursor: pointer; filter: blur(4px); transition: filter .15s; }
  .secret.shown { filter: none; }

  /* Terminal: dark in both themes, as terminals are. */
  .term {
    --t-fg: #e7e5e4; --t-bg: #141211;
    background: var(--t-bg); color: var(--t-fg); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; overflow-y: auto; outline: none; cursor: text; min-height: 260px;
    font: 13px/1.35 ui-monospace, "SF Mono", Menlo, monospace;
  }
  .term:focus { border-color: var(--accent); }
  .term .sb > div, .term .screen > div { white-space: pre; height: 1.35em; overflow: hidden; }
  .term.alt .sb { display: none; }
  .term .cur { background: var(--t-fg) !important; color: var(--t-bg) !important; }
  .term:not(:focus) .cur { background: none !important; color: inherit !important; outline: 1px solid var(--t-fg); outline-offset: -1px; }
  .drawer-body > .term { flex: 1; }

  /* Settings */
  .form { display: grid; grid-template-columns: 200px 1fr; gap: 14px 18px; padding: 18px; align-items: center; max-width: 760px; }
  .form .hint { grid-column: 2; color: var(--muted); font-size: 12px; margin-top: -8px; }
  .form .section { grid-column: 1 / -1; font-weight: 600; padding-top: 6px; border-top: 1px solid var(--line); }
  .form .section:first-child { border-top: 0; padding-top: 0; }
  .switch { display: inline-block; vertical-align: middle; position: relative; width: 34px; height: 20px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch i { position: absolute; inset: 0; background: var(--line); border-radius: 999px; cursor: pointer; transition: background .15s; }
  .switch i::after { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .switch input:checked + i { background: var(--accent); }
  .switch input:checked + i::after { transform: translateX(14px); }
  .banner { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--text); margin-bottom: 12px; border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }

  /* Toasts & dialog */
  #toasts { position: fixed; bottom: 16px; right: 16px; display: grid; gap: 8px; z-index: 30; max-width: min(420px, calc(100% - 32px)); }
  .toast { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--ok); border-radius: 8px; padding: 9px 12px; box-shadow: var(--shadow); white-space: pre-wrap; word-break: break-word; }
  .toast.err { border-left-color: var(--bad); }
  .toast.info { border-left-color: var(--accent); }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); padding: 20px; max-width: 420px; box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h2 { margin: 0 0 8px; font-size: 16px; }
  dialog p { margin: 0 0 18px; color: var(--muted); white-space: pre-wrap; }
  dialog .buttons { display: flex; justify-content: flex-end; gap: 8px; }
  .spin { width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    nav { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 16px; align-items: center; }
    .brand { padding: 0 8px 0 0; }
    .brand small, .nav-item .count, .nav-item svg { display: none; }
    .nav-item { width: auto; white-space: nowrap; }
    .machine { margin: 0 0 0 auto; border: 0; padding: 0; display: flex; }
    .machine .meter, .machine-line, .machine-head { display: none; }
    main { padding: 16px; }
    input[type=search] { width: 100%; }
    .form { grid-template-columns: 1fr; }
    .form .hint { grid-column: 1; }
    dl.kv { grid-template-columns: 1fr; }
    dl.kv dt { margin-top: 6px; }
  }
</style>
</head>
<body>
<div class="app">
  <nav>
    <div class="brand">🔥 lighter <small id="version"></small></div>
    <button class="nav-item" data-view="containers"><span data-icon="box"></span>Containers<span class="count" id="count-containers"></span></button>
    <button class="nav-item" data-view="images"><span data-icon="layers"></span>Images<span class="count" id="count-images"></span></button>
    <button class="nav-item" data-view="volumes"><span data-icon="db"></span>Volumes</button>
    <button class="nav-item" data-view="networks"><span data-icon="net"></span>Networks</button>
    <button class="nav-item" data-view="disk"><span data-icon="disk"></span>Disk usage</button>
    <button class="nav-item" data-view="settings"><span data-icon="gear"></span>Settings</button>
    <button class="nav-item" data-view="log"><span data-icon="log"></span>Machine log</button>
    <div class="machine">
      <div class="machine-head"><span class="dot" id="machine-dot"></span><b id="machine-state">…</b></div>
      <div id="machine-meter" hidden>
        <div class="machine-line"><span>Guest memory</span><span id="machine-mem"></span></div>
        <div class="meter"><i id="machine-mem-bar" style="width:0"></i></div>
        <div class="machine-line" style="margin-top:6px"><span>On the Mac</span><span id="machine-footprint"></span></div>
      </div>
      <div class="machine-buttons">
        <button data-machine="start" title="Start the machine"></button>
        <button data-machine="restart" title="Restart the machine"></button>
        <button data-machine="stop" title="Stop the machine"></button>
      </div>
    </div>
  </nav>

  <main>
    <!-- Containers -->
    <section class="view" id="view-containers">
      <div class="head">
        <h1>Containers</h1><span class="sub" id="containers-summary"></span>
        <span class="spacer"></span>
        <label class="check"><input type="checkbox" id="show-stopped" checked> Show stopped</label>
        <input type="search" id="containers-search" placeholder="Search  /">
      </div>
      <div class="card table" id="containers-body"></div>
    </section>

    <!-- Images -->
    <section class="view" id="view-images">
      <div class="head">
        <h1>Images</h1><span class="sub" id="images-summary"></span>
        <span class="spacer"></span>
        <form id="pull-form" style="display:flex;gap:6px">
          <input type="text" id="pull-name" placeholder="nginx:alpine" autocomplete="off" spellcheck="false">
          <button class="primary" id="pull-button">Pull</button>
        </form>
        <button id="images-prune" class="danger">Remove dangling</button>
        <input type="search" id="images-search" placeholder="Search  /">
      </div>
      <div class="card table" id="images-body"></div>
    </section>

    <!-- Volumes -->
    <section class="view" id="view-volumes">
      <div class="head">
        <h1>Volumes</h1><span class="sub" id="volumes-summary"></span>
        <span class="spacer"></span>
        <button data-refresh>Refresh</button>
        <button id="volumes-prune" class="danger">Delete unused</button>
        <input type="search" id="volumes-search" placeholder="Search  /">
      </div>
      <div class="card table" id="volumes-body"></div>
    </section>

    <!-- Networks -->
    <section class="view" id="view-networks">
      <div class="head">
        <h1>Networks</h1>
        <span class="spacer"></span>
        <button data-refresh>Refresh</button>
        <button id="networks-prune" class="danger">Delete unused</button>
      </div>
      <div class="card table" id="networks-body"></div>
    </section>

    <!-- Disk -->
    <section class="view" id="view-disk">
      <div class="head">
        <h1>Disk usage</h1><span class="sub" id="disk-summary"></span>
        <span class="spacer"></span>
        <button data-refresh>Refresh</button>
      </div>
      <div id="disk-body"></div>
    </section>

    <!-- Settings -->
    <section class="view" id="view-settings">
      <div class="head"><h1>Settings</h1><span class="sub">Saved to <span class="mono">~/.lighter/config.json</span>; applied on the next start.</span></div>
      <div id="settings-banner"></div>
      <form class="card form" id="settings-form"></form>
    </section>

    <!-- Machine log -->
    <section class="view" id="view-log">
      <div class="head">
        <h1>Machine log</h1>
        <span class="spacer"></span>
        <input type="search" id="log-search" placeholder="Filter  /">
      </div>
      <pre class="log" id="log-body" style="height:calc(100vh - 120px)"></pre>
    </section>
  </main>
</div>

<div class="drawer-back" id="drawer-back"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div class="drawer-title">
      <span class="dot" id="d-dot"></span><h2 id="d-name"></h2>
      <span class="spacer"></span>
      <span id="d-actions" style="display:inline-flex;gap:2px"></span>
      <button class="icon" id="d-close" title="Close (Esc)"></button>
    </div>
    <div class="drawer-meta" id="d-meta"></div>
    <div class="tabs" id="d-tabs">
      <button class="tab" data-tab="logs">Logs</button>
      <button class="tab" data-tab="inspect">Inspect</button>
      <button class="tab" data-tab="stats">Stats</button>
      <button class="tab" data-tab="top">Processes</button>
      <button class="tab" data-tab="terminal">Terminal</button>
    </div>
  </div>
  <div class="drawer-body" id="d-body"></div>
</aside>

<dialog id="confirm">
  <h2 id="confirm-title"></h2>
  <p id="confirm-text"></p>
  <div class="buttons"><button id="confirm-no">Cancel</button><button class="primary" id="confirm-yes"></button></div>
</dialog>
<div id="toasts"></div>

<script>
"use strict";
// ---------------------------------------------------------------- basics
const token = location.hash.slice(1);
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];

const ICONS = {
  play: '<svg viewBox="0 0 16 16"><path d="M4.5 2.8v10.4a.6.6 0 0 0 .9.5l8.3-5.2a.6.6 0 0 0 0-1L5.4 2.3a.6.6 0 0 0-.9.5z"/></svg>',
  stop: '<svg viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/></svg>',
  pause: '<svg viewBox="0 0 16 16"><rect x="4" y="3" width="3" height="10" rx="1"/><rect x="9" y="3" width="3" height="10" rx="1"/></svg>',
  restart: '<svg class="s" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5v3h-3"/></svg>',
  trash: '<svg class="s" viewBox="0 0 16 16"><path d="M2.5 4.5h11M6.5 4.5V2.8h3v1.7M4 4.5l.7 8.7h6.6l.7-8.7"/></svg>',
  ext: '<svg class="s" viewBox="0 0 16 16"><path d="M9.5 2.5h4v4M13.5 2.5 8 8M12 9.5v4H2.5V4h4"/></svg>',
  chev: '<svg class="s chev" viewBox="0 0 16 16"><path d="m6 3.5 4.5 4.5L6 12.5"/></svg>',
  close: '<svg class="s" viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></svg>',

// Logs: Docker frames a non-TTY container's output as 8-byte headers (stream,

    for (const t of lines) out.push({ t, err: kind === 2 });
    i += 8 + len;

  for (const k of [1, 2]) if (carry[k]) out.push({ t: carry[k], err: k === 2 });

function spark(values, max) {
  // Spread whatever has been sampled across the width, up to the last 60.
  const w = 300, h = 44, vals = values.slice(-60);
  const top = Math.max(max || 0, ...vals, 1e-9) * 1.15;
  const pts = vals.map((v, k) => `${(w * k / Math.max(1, vals.length - 1)).toFixed(1)},${(h - 2 - (h - 4) * v / top).toFixed(1)}`);
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`); svg.setAttribute("preserveAspectRatio", "none"); svg.setAttribute("class", "spark");
  if (pts.length > 1) {
    const area = document.createElementNS(svg.namespaceURI, "polygon");
    area.setAttribute("points", `${pts[0].split(",")[0]},${h} ${pts.join(" ")} ${w},${h}`);
    const line = document.createElementNS(svg.namespaceURI, "polyline");
    line.setAttribute("points", pts.join(" "));
    svg.append(area, line);
  }
  return svg;
}

function tabStats() {
  const box = el("div", { class: "grid" });
  $("#d-body").replaceChildren(box, el("div", { class: "muted", text: "Sampled every two seconds while this tab is open." }));
  box.append(el("div", { class: "muted", text: "Measuring…" }));
  const sample = async () => {
    if (!detail.id) return;
    let s;
    try { s = await dk(`containers/${detail.id}/stats`); } catch (e) { box.replaceChildren(el("div", { class: "muted", text: e.message })); return; }
    const cpu = s.cpu_stats, pre = s.precpu_stats;
    const cpuDelta = cpu.cpu_usage.total_usage - (pre.cpu_usage?.total_usage || 0);
    const sysDelta = (cpu.system_cpu_usage || 0) - (pre.system_cpu_usage || 0);
    const online = cpu.online_cpus || 1;
    const cpuPct = sysDelta > 0 && cpuDelta >= 0 ? (cpuDelta / sysDelta) * online * 100 : 0;
    const m = s.memory_stats || {};
    const mem = Math.max(0, (m.usage || 0) - (m.stats?.inactive_file ?? m.stats?.cache ?? 0));
    let rx = 0, tx = 0;
    for (const n of Object.values(s.networks || {})) { rx += n.rx_bytes; tx += n.tx_bytes; }
    let rd = 0, wr = 0;
    for (const b of s.blkio_stats?.io_service_bytes_recursive || []) { if (/read/i.test(b.op)) rd += b.value; if (/write/i.test(b.op)) wr += b.value; }
    detail.stats.push({ cpuPct, mem });
    if (detail.stats.length > 60) detail.stats.shift();
    const card = (label, value, extra) => el("div", { class: "card stat" }, el("span", { text: label }), el("b", { text: value }), extra);
    box.replaceChildren(
      card("CPU", cpuPct.toFixed(1) + " %", el("div", null, el("div", { class: "muted", text: `of ${online} core${online === 1 ? "" : "s"} (${online * 100} % max)` }), spark(detail.stats.map((x) => x.cpuPct)))),
      card("Memory", bytes(mem), el("div", null, el("div", { class: "muted", text: m.limit ? "limit " + bytes(m.limit) : "" }), spark(detail.stats.map((x) => x.mem)))),
      card("Network I/O", `${bytes(rx)} / ${bytes(tx)}`, el("div", { class: "muted", text: "received / sent" })),
      card("Block I/O", `${bytes(rd)} / ${bytes(wr)}`, el("div", { class: "muted", text: "read / written" })),
      card("Processes", String(s.pids_stats?.current ?? "—")));
  };
  sample();
  detail.timer = setInterval(sample, 2000);
}

// Enough of an xterm for shells and full-screen programs: cursor movement,
// erasing, scroll regions, the alternate screen, 256 and true colours. It
// draws rows of spans, so selecting and copying are the browser's own.
const PALETTE = (() => {

  const v = [0, 95, 135, 175, 215, 255];

function tabTerminal() {
  if (state.status && state.status.exec === false) {
    $("#d-body").replaceChildren(el("div", { class: "card empty" }, el("b", { text: "Terminals are off" }), "`lighter ui` was started with --no-exec."));
    return;
  }
  const shell = el("select", null, [["auto", "Shell: auto"], ["bash", "bash"], ["sh", "sh"]].map(([v, t]) => el("option", { value: v, text: t })));
  shell.value = load("shell", "auto");
  const status = el("span", { class: "muted" });
  const host = el("div", { class: "term", tabindex: "0" }, el("div", { class: "sb" }), el("div", { class: "screen" }));
  $("#d-body").replaceChildren(
    el("div", { class: "toolbar" }, shell,
      el("button", { onclick: () => start() }, icon("restart"), "New session"), status,
      el("span", { class: "spacer" }), el("span", { class: "muted", text: "⌘C copy · ⌘V paste" })),
    host);

  const container = detail.id;
  let term = null, session = null, abort = null, queue = "", writing = false, resizing = 0;
  const post = (path, body) => fetch("/api/" + path, { method: "POST", headers: { "X-Lighter-Token": token, "Content-Type": "application/octet-stream" }, body });

  // Keystrokes go up one request at a time, so they arrive in order.
  const send = async (s) => {
    queue += s;
    if (writing || !session) return;
    writing = true;
    while (queue && session) {
      const out = queue; queue = "";
      const id = session;
      try { const r = await post(`exec/${id}`, new TextEncoder().encode(out)); if (r.status === 410) break; } catch { break; }
    }
    writing = false;
  };
  // The read waits on the server until there is output, so this loop is idle while the shell is.
  const pump = async (id, signal) => {
    const dec = new TextDecoder();
    while (session === id) {
      let res;
      try { res = await fetch(`/api/exec/${id}`, { headers: { "X-Lighter-Token": token }, signal }); }
      catch { if (signal.aborted) return; await new Promise((r) => setTimeout(r, 1000)); continue; }
      if (res.status === 200) term.write(dec.decode(new Uint8Array(await res.arrayBuffer()), { stream: true }));
      else if (res.status !== 204) {
        const j = await res.json().catch(() => ({}));
        if (session !== id) return;
        session = null;
        const how = j.exit_code != null ? `exited with code ${j.exit_code}` : (j.error || "ended");
        term.write(`\r\n\x1b[2m[session ${how}]\x1b[0m\r\n`);
        status.textContent = "";
        return;
      }
    }
  };
  const stop = () => {
    if (session) fetch(`/api/exec/${session}`, { method: "DELETE", headers: { "X-Lighter-Token": token } }).catch(() => {});
    session = null;
    if (abort) abort.abort();
  };
  const start = async () => {
    stop();
    save("shell", shell.value);
    host.querySelector(".sb").replaceChildren();
    term = new Term(host, send);
    const { cols, rows } = term.fit();
    status.textContent = "Connecting…";
    try {
      const r = await (await call("POST", "exec", { container, cols, rows, shell: shell.value })).json();
      if (detail.id !== container || detail.cleanup !== cleanup) { fetch(`/api/exec/${r.session}`, { method: "DELETE", headers: { "X-Lighter-Token": token } }); return; }
      session = r.session;
      abort = new AbortController();
      status.textContent = "";
      pump(session, abort.signal);
      if (queue) send("");
      host.focus({ preventScroll: true });
    } catch (e) {
      status.textContent = "";
      term.write(`\x1b[31m${e.message}\x1b[0m\r\n`);
    }
  };
  const observer = new ResizeObserver(() => {
    if (!term) return;
    const { cols, rows, changed } = term.fit();
    if (!changed || !session) return;
    clearTimeout(resizing);
    const id = session;
    resizing = setTimeout(() => post(`exec/${id}/resize?cols=${cols}&rows=${rows}`).catch(() => {}), 150);
  });
  const cleanup = () => { observer.disconnect(); clearTimeout(resizing); stop(); };
  detail.cleanup = cleanup;
  shell.onchange = start;
  observer.observe(host);
  start();
}

const LOADERS = { containers: loadContainers, images: loadImages, volumes: loadVolumes, networks: loadNetworks, disk: loadDisk, settings: loadSettings, log: loadLog };
// Only what changes on its own is polled; the rest loads when shown, after an action, or on Refresh.
const POLLED = new Set(["containers", "log"]);

function setView(view) {
  if (!LOADERS[view]) view = "containers";
  state.view = view; save("view", view);
  for (const b of $$(".nav-item")) b.classList.toggle("active", b.dataset.view === view);
  for (const v of $$(".view")) v.classList.toggle("active", v.id === "view-" + view);
  refresh(true);
}

let refreshing = false, again = false, lastStatus = 0;
async function refresh(force) {
  if (document.hidden) return;
  // One at a time; a forced refresh asked for meanwhile runs right after.
  if (refreshing) { again = again || force; return; }
  refreshing = true;
  try {
    if (force || Date.now() - lastStatus > 5000 || !state.status) { await refreshStatus(); lastStatus = Date.now(); }
    const view = state.view;
    if (DOCKER_VIEWS.includes(view) && !(state.status.running && state.status.docker)) {
      $(`#${view}-body`).replaceChildren(state.status.running ? el("div", { class: "card empty" }, el("b", { text: "Starting…" }), "Docker is not answering yet.") : stoppedNotice());
    } else if (force || POLLED.has(view)) {
      await LOADERS[view]();
    }
  } catch (e) {
    if (force) toast(e.message, "err");
  } finally {
    refreshing = false;
    if (again) { again = false; refresh(true); }
  }
}

  if (document.activeElement && document.activeElement.closest(".term")) return;  // keys belong to the shell
  if (e.key === "Escape" && detail.id && !$("#confirm").open) closeDetail();
  if (e.key === "/" && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) {
    const s = $(`#view-${state.view} input[type=search]`);
    if (s) { e.preventDefault(); s.focus(); }
  }
});

setInterval(() => { if (POLLED.has(state.view) || Date.now() - lastStatus > 5000) refresh(); }, 3000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(true); });
// A new link pasted over this one changes only the fragment, which does not reload.
window.addEventListener("hashchange", () => location.reload());
function stale() {
  document.body.replaceChildren(el("div", { class: "empty" },
    el("b", { text: "This page's link has expired" }),
    "`lighter ui` gives out a new link each time it starts. Open the one it printed last."));
}
if (!token) {
  document.body.replaceChildren(el("div", { class: "empty" }, el("b", { text: "No token in the address" }), "Open the link `lighter ui` printed."));
} else {
  setView(state.view);
}
</script>
</body>
</html>
