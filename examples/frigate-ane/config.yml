# Frigate with the detector on the Mac's Neural Engine. Start the container
# with --device lighter.sh/ane=all; see README.md.
mqtt:
  enabled: true
  host: mosquitto

detectors:
  ane:
    type: lighter_ane

model:
  path: /models/yolo11n.onnx
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nchw
  input_pixel_format: rgb
  input_dtype: float
  labelmap_path: /labelmap/coco-80.txt

cameras:
  front:
    ffmpeg:
      inputs:
        - path: rtsp://user:password@192.168.1.50:554/h264Preview_01_sub
          roles:
            - detect
    detect:
      width: 640
      height: 360
      fps: 5
    objects:
      track:
        - person
        - car
