# As a NAS that offers file ids (a QNAP does): macOS numbers files by the
# server's ids, which a rename keeps, rather than by their names.
[global]
server min protocol = SMB2
map to guest = never
ea support = yes
vfs objects = catia fruit streams_xattr
fruit:metadata = stream
fruit:zero_file_id = no
[f]
path = /srv/f
read only = no
force user = lt
