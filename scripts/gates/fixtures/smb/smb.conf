[global]
server min protocol = SMB2
map to guest = never
ea support = yes
vfs objects = catia fruit streams_xattr
fruit:metadata = stream
[d]
path = /srv/d
read only = no
force user = lt
[t]
path = /srv/t
read only = no
force user = lt
# As a QNAP serves a share (#69): permissions are the server's, from ACLs
# every new file inherits. A client's chmod is refused, its owner's too, every
# new file is rwxrwxr-x, and a dot-file whose times are set is stored hidden,
# after which its extended attributes can be created but not overwritten.
[q]
path = /srv/q
read only = no
valid users = lt
store dos attributes = yes
vfs objects = catia fruit streams_xattr acl_xattr
fruit:nfs_aces = yes
nt acl support = yes
inherit acls = yes
inherit permissions = yes
map acl inherit = yes
# A chmod is accepted and changes nothing; the Mac's client reports the bits
# it asked for until its cache lapses.
[n]
path = /srv/n
read only = no
force user = lt
nt acl support = no
fruit:nfs_aces = no
