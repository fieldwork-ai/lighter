# cargo-about: the licences a crate shipped in lighter may carry, and the
# targets lighter ships for (the Mac binary, the guest's agent and ONNX
# Runtime plugin). A crate under anything else fails scripts/notices.py and CI;
# adding a licence here is a decision, not a fix.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
]
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
